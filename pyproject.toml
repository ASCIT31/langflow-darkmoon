[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langflow-darkmoon"
version = "0.1.0"
description = "Langflow components for Darkmoon, the local privacy-first autonomous AI penetration testing engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ASC-IT (Darkmoon)" }]
keywords = ["langflow", "lfx", "darkmoon", "pentest", "security", "dast", "appsec", "ai-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "lfx>=0.1",
    "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/ASCIT31/Dark-Moon"
Source = "https://github.com/ASCIT31/langflow-darkmoon"
Issues = "https://github.com/ASCIT31/langflow-darkmoon/issues"

[tool.setuptools]
packages = ["darkmoon"]

[tool.setuptools.package-data]
darkmoon = ["*.svg"]
